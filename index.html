<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Melon Sandbox - Кровь на полу</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        button {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px) scale(0.97);
        }
    </style>
</head>
<body class="bg-slate-900 text-white overflow-hidden">

    <!-- Верхняя панель управления -->
    <div class="fixed top-3 left-1/2 -translate-x-1/2 z-20 w-[95%] max-w-4xl glass-panel rounded-2xl p-3 shadow-2xl">
        <div class="flex flex-wrap items-center justify-between gap-2">
            
            <!-- Категории / Спавн -->
            <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1 max-w-full">
                <!-- Персонажи -->
                <div class="flex gap-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
                    <button id="btn-melon" title="Мелон" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1.5 shadow">
                        🍉 <span>Мелон</span>
                    </button>
                    <button id="btn-pumpkin" title="Тыква" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1.5 shadow">
                        🎃 <span>Тыква</span>
                    </button>
                    <button id="btn-apple" title="Яблоко" class="bg-red-600 hover:bg-red-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1.5 shadow">
                        🍎 <span>Яблоко</span>
                    </button>
                </div>

                <!-- Предметы и Оружие -->
                <div class="flex gap-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
                    <button id="btn-box" class="bg-amber-800 hover:bg-amber-700 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1">
                        📦 <span>Ящик</span>
                    </button>
                    <button id="btn-barrel" class="bg-orange-800 hover:bg-orange-700 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1">
                        🛢️ <span>Бочка</span>
                    </button>
                    <button id="btn-sword" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1">
                        🗡️ <span>Меч</span>
                    </button>
                    <button id="btn-gun" class="bg-stone-600 hover:bg-stone-500 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1">
                        🔫 <span>Пистолет</span>
                    </button>
                    <button id="btn-bomb" class="bg-rose-700 hover:bg-rose-600 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1">
                        💣 <span>Бомба</span>
                    </button>
                </div>

                <!-- Шприцы -->
                <div class="flex gap-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
                    <button id="btn-syringe-heal" class="bg-teal-600 hover:bg-teal-500 text-white font-medium py-1.5 px-2.5 rounded-lg text-xs flex items-center gap-1" title="Лечение">
                        💉 <span>Хил</span>
                    </button>
                    <button id="btn-syringe-acid" class="bg-lime-600 hover:bg-lime-500 text-white font-medium py-1.5 px-2.5 rounded-lg text-xs flex items-center gap-1" title="Кислота">
                        🧪 <span>Кислота</span>
                    </button>
                </div>
            </div>

            <!-- Системные кнопки -->
            <div class="flex items-center gap-2">
                <!-- Скорость времени -->
                <select id="select-speed" class="bg-slate-800 text-xs md:text-sm text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 outline-none cursor-pointer">
                    <option value="1">⏱️ 1.0x</option>
                    <option value="0.2">🐌 Slow-Mo</option>
                    <option value="2">⚡ 2.0x</option>
                    <option value="0">⏸️ Пауза</option>
                </select>

                <button id="btn-mode-3d" class="bg-indigo-700 hover:bg-indigo-600 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-indigo-500/50" title="Включить 3D физику падения на задний фон">
                    🧊 <span>3D Глубина: Вкл</span>
                </button>

                <button id="btn-reset-cam" class="bg-sky-800 hover:bg-sky-700 text-sky-100 font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-sky-600/50" title="Сбросить камеру в стандартный вид сбоку">
                    🎥 <span>Сброс камеры</span>
                </button>

                <button id="btn-clear" class="bg-red-900/80 hover:bg-red-800 text-red-200 font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-red-700/50">
                    🗑️ <span>Очистить</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Инструкция внизу -->
    <div class="fixed bottom-3 left-3 z-10 glass-panel rounded-xl p-3 text-xs text-slate-300 max-w-xs space-y-1 pointer-events-none">
        <div class="font-semibold text-slate-100 flex items-center gap-1">🎮 Управление:</div>
        <div>• <b>ЛКМ:</b> Хватать и кидать объекты</div>
        <div>• <b>Стрелки ⬅️ ➡️ ⬆️ ⬇️:</b> Вращать камеру во все стороны</div>
        <div>• <b>Колесико мыши:</b> Двигать объект вглубь/вперед (в 3D)</div>
        <div>• <b>Двойной клик по 💣:</b> Взрыв бомбы</div>
        <div>• <b>Клик по 🔫 Пистолету:</b> Выстрел пулей</div>
    </div>

    <!-- Игровой холст -->
    <canvas id="game-canvas"></canvas>

    <!-- Подключаем Three.js и Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        let scene, camera, renderer;
        let world;
        let physicsObjects = [];
        let particleSystems = [];
        let stains = [];
        const MAX_STAINS = 1000; // Увеличено для МОРЯ крови
        const stainMaterials = {}; // Кэш материалов для устранения лагов
        const sharedStainGeom = new THREE.CircleGeometry(1, 8); // Общая геометрия для оптимизации
        
        let cameraAzimuth = 0;
        let cameraElevation = 0.12;
        let cameraDistance = 32;
        const cameraTarget = new THREE.Vector3(0, 4, 0);
        const keysPressed = {};

        function updateCameraPosition() {
            const cosElev = Math.cos(cameraElevation);
            camera.position.x = cameraTarget.x + cameraDistance * cosElev * Math.sin(cameraAzimuth);
            camera.position.y = cameraTarget.y + cameraDistance * Math.sin(cameraElevation);
            camera.position.z = cameraTarget.z + cameraDistance * cosElev * Math.cos(cameraAzimuth);
            camera.lookAt(cameraTarget);
        }

        function resetCamera() {
            cameraAzimuth = 0;
            cameraElevation = 0.12;
            cameraDistance = 32;
            updateCameraPosition();
        }

        let raycaster, mouse, dragPlane;
        let mouseConstraint = null;
        let constrainedBody = null;
        let mouseKinematicBody;
        let isDragging = false;

        let physicsMaterial;
        let gameSpeed = 1.0;
        let is3DMode = true; 
        let backWallMesh, backWallBody;

        // Звуковой синтезатор (Web Audio API)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type, param = 1) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'shot') {
                    const bufferSize = audioCtx.sampleRate * 0.15;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1000, now);
                    filter.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start(now);
                } else if (type === 'explosion') {
                    const bufferSize = audioCtx.sampleRate * 0.6;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(600, now);
                    filter.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.8, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start(now);
                } else if (type === 'hit') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const vol = Math.min(Math.max(param, 0.05), 0.5);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140 + Math.random() * 40, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'splat') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const vol = Math.min(Math.max(param, 0.05), 0.6);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220 + Math.random() * 60, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch(e) {}
        }

        function initThree() {
            const canvas = document.getElementById('game-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(15, 25, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -25;
            dirLight.shadow.camera.right = 25;
            dirLight.shadow.camera.top = 25;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            // 3D задняя стенка (Задний фон)
            const backGeo = new THREE.PlaneGeometry(100, 50);
            const backMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85, metalness: 0.2 });
            backWallMesh = new THREE.Mesh(backGeo, backMat);
            backWallMesh.position.set(0, 20, -5.8);
            backWallMesh.receiveShadow = true;
            scene.add(backWallMesh);

            const backGrid = new THREE.GridHelper(100, 50, 0x0284c7, 0x1f2937);
            backGrid.rotation.x = Math.PI / 2;
            backGrid.position.set(0, 20, -5.75);
            backGrid.material.opacity = 0.35;
            backGrid.material.transparent = true;
            scene.add(backGrid);

            const planeGeo = new THREE.PlaneGeometry(1000, 1000);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            dragPlane = new THREE.Mesh(planeGeo, planeMat);
            scene.add(dragPlane);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
        }

        function initCannon() {
            world = new CANNON.World();
            world.gravity.set(0, -18, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 25;
            world.solver.tolerance = 0.0001;

            physicsMaterial = new CANNON.Material("standard");
            const contactMat = new CANNON.ContactMaterial(
                physicsMaterial, physicsMaterial,
                { friction: 0.4, restitution: 0.15 }
            );
            world.addContactMaterial(contactMat);

            mouseKinematicBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
            mouseKinematicBody.addShape(new CANNON.Sphere(0.1));
            mouseKinematicBody.collisionFilterGroup = 0;
            world.addBody(mouseKinematicBody);

            createGround();
        }

        function createGround() {
            const groundGeo = new THREE.BoxGeometry(100, 2, 14);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7, metalness: 0.2 });
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.position.set(0, -1, 0); 
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // Верхняя граница земли находится на Y = 0.1 (0.05 + 0.1/2)
            const edgeGeo = new THREE.BoxGeometry(100, 0.1, 14);
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
            const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
            edgeMesh.position.set(0, 0.05, 0);
            scene.add(edgeMesh);

            const groundShape = new CANNON.Box(new CANNON.Vec3(50, 1, 7));
            const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            groundBody.addShape(groundShape);
            groundBody.position.set(0, -1, 0);
            world.addBody(groundBody);

            const backWallShape = new CANNON.Box(new CANNON.Vec3(50, 25, 1));
            backWallBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            backWallBody.addShape(backWallShape);
            backWallBody.position.set(0, 20, -6.8);
            world.addBody(backWallBody);

            const frontWallShape = new CANNON.Box(new CANNON.Vec3(50, 25, 1));
            const frontWallBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            frontWallBody.addShape(frontWallShape);
            frontWallBody.position.set(0, 20, 6.5);
            world.addBody(frontWallBody);
        }

        function updatePhysicsFactors(body) {
            if (is3DMode) {
                body.linearFactor = new CANNON.Vec3(1, 1, 1);
                body.angularFactor = new CANNON.Vec3(1, 1, 1);
            } else {
                body.linearFactor = new CANNON.Vec3(1, 1, 0);
                body.angularFactor = new CANNON.Vec3(0, 0, 1);
                body.position.z = 0;
                body.velocity.z = 0;
                body.angularVelocity.x = 0;
                body.angularVelocity.y = 0;
            }
        }

        function getStainMaterial(colorHex) {
            if (!stainMaterials[colorHex]) {
                stainMaterials[colorHex] = new THREE.MeshBasicMaterial({ 
                    color: colorHex, 
                    transparent: true, 
                    opacity: 0.85, 
                    depthWrite: false 
                });
            }
            return stainMaterials[colorHex];
        }

        function createStain(x, y, colorHex, scale = 1, z = 0, surfaceType = 'auto') {
            const isWall = (surfaceType === 'wall') || (surfaceType === 'auto' && z <= -5.0);
            
            const mat = getStainMaterial(colorHex);
            const mesh = new THREE.Mesh(sharedStainGeom, mat);
            
            const radius = (0.2 + Math.random() * 0.5) * scale;
            // Делаем пятно немного овальным для реалистичности
            mesh.scale.set(radius, radius * (0.7 + Math.random() * 0.6), 1);

            if (isWall) {
                // На задней стенке, добавляем небольшой рандом к Z, чтобы избежать наложения
                mesh.position.set(x, Math.max(0.2, y), -5.74 + (Math.random() * 0.01));
                mesh.rotation.set(0, 0, Math.random() * Math.PI * 2);
            } else {
                // На полу! Верхний край пола находится на Y = 0.1
                const clampedZ = Math.max(-5.5, Math.min(5.5, z));
                mesh.position.set(x, 0.11 + (Math.random() * 0.005), clampedZ);
                mesh.rotation.set(-Math.PI / 2, 0, Math.random() * Math.PI * 2);
            }

            scene.add(mesh);
            stains.push(mesh);

            if (stains.length > MAX_STAINS) {
                const oldest = stains.shift();
                scene.remove(oldest);
                // Геометрия и материал общие - dispose() вызывать не нужно! Это полностью убирает лаги.
            }
        }

        function spawnJuiceParticles(pos, colorHex, count = 20, isDrip = false) {
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const landed = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                if (isDrip) {
                    // При капании жидкость просто падает вниз с минимальным разбросом
                    velocities.push(
                        (Math.random() - 0.5) * 1.5,
                        -(Math.random() * 2), 
                        is3DMode ? (Math.random() - 0.5) * 1.5 : (Math.random() - 0.5) * 0.5
                    );
                } else {
                    // При ударе брызги разлетаются во все стороны
                    velocities.push(
                        (Math.random() - 0.5) * 12,
                        Math.random() * 7 + 1, 
                        is3DMode ? (Math.random() - 0.5) * 10 : (Math.random() - 0.5) * 2
                    );
                }
                landed.push(false);
            }

            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.3, transparent: true, opacity: 0.95 });
            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            particleSystems.push({
                mesh: pSystem,
                count: count,
                velocities: velocities,
                landed: landed,
                colorHex: colorHex,
                life: 1.0
            });
        }

        function createShape(type, x, y, options = {}) {
            const mass = options.mass || 1;
            const color = options.color || 0xcccccc;
            
            let shape, geometry;
            const w = options.w || 1, h = options.h || 1, d = options.d || 1;
            const r = options.r || 0.5;

            if (type === 'box') {
                shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
                geometry = new THREE.BoxGeometry(w, h, d);
            } else if (type === 'sphere') {
                shape = new CANNON.Sphere(r);
                geometry = new THREE.SphereGeometry(r, 24, 24);
            } else if (type === 'cylinder') {
                shape = new CANNON.Cylinder(r, r, h, 16);
                geometry = new THREE.CylinderGeometry(r, r, h, 16);
            }

            const body = new CANNON.Body({ mass: mass, material: physicsMaterial });
            body.addShape(shape);
            const initialZ = options.z !== undefined ? options.z : (is3DMode ? (Math.random() - 0.5) * 2 : 0);
            body.position.set(x, y, initialZ);
            updatePhysicsFactors(body);

            body.isBomb = options.isBomb || false;
            body.isGun = options.isGun || false;
            body.isSyringe = options.isSyringe || false;
            body.syringeType = options.syringeType || null;
            body.isFruit = options.isFruit || false;
            body.juiceColor = options.juiceColor || null;
            body.lastHitTime = 0;
            body.bleedAmount = 0; // Отслеживание текущего кровотечения

            body.addEventListener('collide', (e) => {
                const impact = Math.abs(e.contact.getImpactVelocityAlongNormal());
                const now = performance.now();
                
                // Троттлинг 80мс на каждый объект отдельно, чтобы убрать лаги при застревании и дать больше крови
                if (impact > 2.5 && (now - body.lastHitTime > 80)) {
                    body.lastHitTime = now;
                    initAudio();
                    const volume = Math.min(impact / 20, 0.6);
                    
                    if (body.isFruit || body.juiceColor) {
                        playSound(body.isFruit ? 'splat' : 'hit', volume);
                        if (impact > 4 && body.juiceColor) {
                            spawnJuiceParticles(body.position, body.juiceColor, Math.floor(volume * 80));
                            body.bleedAmount = Math.min(body.bleedAmount + impact * 2, 100); // Добавляем эффект кровотечения
                        }
                    } else {
                        playSound('hit', volume);
                    }
                }
            });

            world.addBody(body);

            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: options.roughness || 0.4,
                metalness: options.metalness || 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.body = body;
            scene.add(mesh);

            physicsObjects.push({ mesh, body, juiceColor: options.juiceColor || color });
            return body;
        }

        function explode(center, radius = 10, force = 750) {
            initAudio();
            playSound('explosion');

            // Огромный всплеск огня/крови при самом взрыве
            spawnJuiceParticles(center, 0xf97316, 120);

            for (let i = 0; i < world.bodies.length; i++) {
                const b = world.bodies[i];
                if (b.mass === 0 || b.type === CANNON.Body.KINEMATIC) continue;

                const dist = b.position.distanceTo(center);
                if (dist < radius && dist > 0) {
                    const dir = new CANNON.Vec3();
                    b.position.vsub(center, dir);
                    
                    if (is3DMode) {
                        dir.z += (Math.random() - 0.5) * 1.2;
                    } else {
                        dir.z = 0;
                    }

                    dir.normalize();
                    const pForce = force * (1 - (dist / radius));
                    dir.scale(pForce, dir);
                    b.applyImpulse(dir, b.position);

                    const item = physicsObjects.find(o => o.body === b);
                    if (item && item.juiceColor) {
                        // Брызги сока и инициация кровотечения при взрыве
                        spawnJuiceParticles(b.position, item.juiceColor, 80);
                        b.bleedAmount = Math.min((b.bleedAmount || 0) + 60, 100);
                    }
                }
            }
        }

        function spawnRagdoll(x, y, type = 'melon') {
            let mainColor, bodyColor, juiceColor;
            if (type === 'melon') {
                mainColor = 0x10b981; 
                bodyColor = 0x047857;
                juiceColor = 0xef4444; 
            } else if (type === 'pumpkin') {
                mainColor = 0xf59e0b; 
                bodyColor = 0xd97706;
                juiceColor = 0xf97316; 
            } else {
                mainColor = 0xef4444; 
                bodyColor = 0xb91c1c;
                juiceColor = 0xd97706; 
            }

            const z = is3DMode ? (Math.random() - 0.5) * 2 : 0;

            function createPart(w, h, d, px, py, pz, color, mass = 1) {
                const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
                const body = new CANNON.Body({ mass: mass, material: physicsMaterial });
                body.addShape(shape);
                body.position.set(px, py, pz);
                updatePhysicsFactors(body);

                body.isFruit = true;
                body.juiceColor = juiceColor;
                body.ragdollType = type;
                body.lastHitTime = 0;
                body.bleedAmount = 0; // Отслеживание кровотечения части тела

                body.addEventListener('collide', (e) => {
                    const impact = Math.abs(e.contact.getImpactVelocityAlongNormal());
                    const now = performance.now();
                    if (impact > 2.5 && (now - body.lastHitTime > 80)) {
                        body.lastHitTime = now;
                        initAudio();
                        const volume = Math.min(impact / 20, 0.6);
                        playSound('splat', volume);
                        if (impact > 3.5) {
                            // ОГРОМНОЕ количество крови из частей тела при сильных ударах
                            spawnJuiceParticles(body.position, body.juiceColor, Math.floor(volume * 150));
                            body.bleedAmount = Math.min(body.bleedAmount + impact * 3, 100);
                        }
                    }
                });

                world.addBody(body);

                const geom = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.1 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.body = body;
                scene.add(mesh);

                physicsObjects.push({ mesh, body, juiceColor });
                return body;
            }

            const head = createPart(0.8, 0.8, 0.8, x, y + 1.8, z, mainColor, 1.2);
            const torso = createPart(0.9, 1.3, 0.5, x, y + 0.8, z, bodyColor, 2.5);
            const armL = createPart(0.35, 0.9, 0.35, x - 0.7, y + 0.9, z, mainColor, 0.6);
            const armR = createPart(0.35, 0.9, 0.35, x + 0.7, y + 0.9, z, mainColor, 0.6);
            const legL = createPart(0.38, 1.0, 0.38, x - 0.3, y - 0.3, z, bodyColor, 0.8);
            const legR = createPart(0.38, 1.0, 0.38, x + 0.3, y - 0.3, z, bodyColor, 0.8);

            function join(bodyA, pivotA, bodyB, pivotB) {
                const c = new CANNON.PointToPointConstraint(
                    bodyA, new CANNON.Vec3(...pivotA),
                    bodyB, new CANNON.Vec3(...pivotB)
                );
                world.addConstraint(c);
            }

            join(head, [0, -0.45, 0], torso, [0, 0.7, 0]);
            join(armL, [0, 0.4, 0], torso, [-0.55, 0.5, 0]);
            join(armR, [0, 0.4, 0], torso, [0.55, 0.5, 0]);
            join(legL, [0, 0.45, 0], torso, [-0.25, -0.7, 0]);
            join(legR, [0, 0.45, 0], torso, [0.25, -0.7, 0]);
        }

        function spawnWeapon(type) {
            const x = (Math.random() - 0.5) * 6;
            const y = 10;

            if (type === 'barrel') {
                const body = createShape('cylinder', x, y, { r: 0.7, h: 1.6, mass: 4, color: 0xea580c, roughness: 0.3, metalness: 0.4, juiceColor: 0x1c1917 });
                body.isBomb = true;
            } else if (type === 'sword') {
                const body = createShape('box', x, y, { w: 0.25, h: 2.2, d: 0.15, mass: 1.5, color: 0xcbd5e1, roughness: 0.2, metalness: 0.8, juiceColor: 0x94a3b8 });
                body.isWeapon = true;
            } else if (type === 'gun') {
                const body = createShape('box', x, y, { w: 0.8, h: 0.5, d: 0.25, mass: 1.2, color: 0x334155, roughness: 0.3, metalness: 0.7, juiceColor: 0x1e293b });
                body.isGun = true;
            } else if (type === 'syringe-heal') {
                const body = createShape('cylinder', x, y, { r: 0.2, h: 0.9, mass: 0.8, color: 0x14b8a6, roughness: 0.2, metalness: 0.5, juiceColor: 0x14b8a6 });
                body.isSyringe = true;
                body.syringeType = 'heal';
            } else if (type === 'syringe-acid') {
                const body = createShape('cylinder', x, y, { r: 0.2, h: 0.9, mass: 0.8, color: 0x84cc16, roughness: 0.2, metalness: 0.5, juiceColor: 0x84cc16 });
                body.isSyringe = true;
                body.syringeType = 'acid';
            }
        }

        function shootGun(gunBody) {
            initAudio();
            playSound('shot');

            const dir = new THREE.Vector3(1, 0.1, (Math.random() - 0.5) * 0.2).normalize();
            const spawnPos = new THREE.Vector3(gunBody.position.x + dir.x * 0.8, gunBody.position.y + dir.y * 0.8, gunBody.position.z);

            const shape = new CANNON.Sphere(0.15);
            const bulletBody = new CANNON.Body({ mass: 0.3, material: physicsMaterial });
            bulletBody.addShape(shape);
            bulletBody.position.copy(spawnPos);
            bulletBody.velocity.set(dir.x * 45, dir.y * 45, dir.z * 45);
            updatePhysicsFactors(bulletBody);

            const geom = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const mesh = new THREE.Mesh(geom, mat);
            scene.add(mesh);

            physicsObjects.push({ mesh, body: bulletBody, juiceColor: 0xfacc15 });
            world.addBody(bulletBody);

            spawnJuiceParticles(spawnPos, 0xfde047, 6);

            bulletBody.addEventListener('collide', (e) => {
                const hitBody = e.body;
                if (hitBody && hitBody !== gunBody) {
                    if (hitBody.juiceColor) {
                        spawnJuiceParticles(bulletBody.position, hitBody.juiceColor, 100);
                        hitBody.bleedAmount = Math.min((hitBody.bleedAmount || 0) + 50, 100);
                    }
                    const pushDir = new CANNON.Vec3(dir.x * 80, dir.y * 80, dir.z * 80);
                    hitBody.applyImpulse(pushDir, bulletBody.position);
                    setTimeout(() => removeBodyAndMesh(bulletBody), 10);
                }
            });

            setTimeout(() => {
                removeBodyAndMesh(bulletBody);
            }, 2000);
        }

        function setupInteractions() {
            function updateMousePos(e) {
                let cx = e.clientX, cy = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    cx = e.touches[0].clientX;
                    cy = e.touches[0].clientY;
                }
                mouse.x = (cx / window.innerWidth) * 2 - 1;
                mouse.y = -(cy / window.innerHeight) * 2 + 1;
            }

            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    keysPressed[e.code] = true;
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    keysPressed[e.code] = false;
                }
            });

            function onWheel(e) {
                if (isDragging && constrainedBody && is3DMode) {
                    e.preventDefault();
                    const delta = Math.sign(e.deltaY) * -0.6;
                    let newZ = mouseKinematicBody.position.z + delta;
                    newZ = Math.max(-5.7, Math.min(5.7, newZ));
                    mouseKinematicBody.position.z = newZ;
                }
            }

            function onPointerDown(e) {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
                initAudio();
                updateMousePos(e);
                raycaster.setFromCamera(mouse, camera);

                const meshes = physicsObjects.map(o => o.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const hitBody = hitMesh.userData.body;

                    if (hitBody.isBomb && e.detail === 2) {
                        explode(hitBody.position);
                        removeBodyAndMesh(hitBody);
                        return;
                    }

                    if (hitBody.isGun) {
                        shootGun(hitBody);
                    }

                    isDragging = true;
                    constrainedBody = hitBody;
                    const p = intersects[0].point;
                    mouseKinematicBody.position.set(p.x, p.y, hitBody.position.z);

                    const localPivot = new CANNON.Vec3();
                    constrainedBody.pointToLocalFrame(new CANNON.Vec3(p.x, p.y, hitBody.position.z), localPivot);

                    mouseConstraint = new CANNON.PointToPointConstraint(
                        mouseKinematicBody, new CANNON.Vec3(0,0,0),
                        constrainedBody, localPivot
                    );
                    world.addConstraint(mouseConstraint);
                    constrainedBody.wakeUp();
                }
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                updateMousePos(e);
                raycaster.setFromCamera(mouse, camera);
                
                dragPlane.position.z = mouseKinematicBody.position.z;
                dragPlane.quaternion.copy(camera.quaternion);

                const intersects = raycaster.intersectObject(dragPlane);
                if (intersects.length > 0) {
                    mouseKinematicBody.position.x = intersects[0].point.x;
                    mouseKinematicBody.position.y = intersects[0].point.y;
                }
            }

            function onPointerUp() {
                if (isDragging && mouseConstraint) {
                    world.removeConstraint(mouseConstraint);
                    mouseConstraint = null;
                    constrainedBody = null;
                    isDragging = false;
                }
            }

            window.addEventListener('wheel', onWheel, { passive: false });
            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('dblclick', onPointerDown);

            window.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        function removeBodyAndMesh(body) {
            world.removeBody(body);
            const idx = physicsObjects.findIndex(o => o.body === body);
            if (idx !== -1) {
                scene.remove(physicsObjects[idx].mesh);
                physicsObjects.splice(idx, 1);
            }
        }

        function setupUI() {
            document.getElementById('btn-melon').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'melon');
            document.getElementById('btn-pumpkin').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'pumpkin');
            document.getElementById('btn-apple').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'apple');

            document.getElementById('btn-box').onclick = () => createShape('box', (Math.random() - 0.5) * 6, 10, { w: 1.6, h: 1.6, d: 1.6, mass: 2, color: 0xa16207, juiceColor: 0x713f12 }); // Щепки
            document.getElementById('btn-barrel').onclick = () => spawnWeapon('barrel');
            document.getElementById('btn-sword').onclick = () => spawnWeapon('sword');
            document.getElementById('btn-gun').onclick = () => spawnWeapon('gun');
            document.getElementById('btn-bomb').onclick = () => createShape('sphere', (Math.random() - 0.5) * 6, 10, { r: 0.8, mass: 3, color: 0xe11d48, isBomb: true, juiceColor: 0x4c0519 }); // Темный порох/осколки

            document.getElementById('btn-syringe-heal').onclick = () => spawnWeapon('syringe-heal');
            document.getElementById('btn-syringe-acid').onclick = () => spawnWeapon('syringe-acid');

            document.getElementById('btn-reset-cam').onclick = () => resetCamera();

            const btn3d = document.getElementById('btn-mode-3d');
            btn3d.onclick = () => {
                is3DMode = !is3DMode;
                btn3d.innerHTML = is3DMode ? '🧊 <span>3D Глубина: Вкл</span>' : '🟦 <span>2D Плоскость</span>';
                btn3d.className = is3DMode 
                    ? 'bg-indigo-700 hover:bg-indigo-600 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-indigo-500/50'
                    : 'bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-slate-600';
                
                physicsObjects.forEach(obj => updatePhysicsFactors(obj.body));
            };

            document.getElementById('select-speed').onchange = (e) => {
                gameSpeed = parseFloat(e.target.value);
            };

            document.getElementById('btn-clear').onclick = () => {
                for (let i = physicsObjects.length - 1; i >= 0; i--) {
                    world.removeBody(physicsObjects[i].body);
                    scene.remove(physicsObjects[i].mesh);
                }
                physicsObjects = [];
                while (world.constraints.length > 0) {
                    world.removeConstraint(world.constraints[0]);
                }
                for (let i = 0; i < stains.length; i++) {
                    scene.remove(stains[i]);
                }
                stains = [];
            };

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        const fixedTimeStep = 1 / 60;
        let lastTime;

        function animate(time) {
            requestAnimationFrame(animate);

            let cameraRotated = false;
            const rotSpeed = 0.025;
            if (keysPressed['ArrowLeft']) {
                cameraAzimuth -= rotSpeed;
                cameraRotated = true;
            }
            if (keysPressed['ArrowRight']) {
                cameraAzimuth += rotSpeed;
                cameraRotated = true;
            }
            if (keysPressed['ArrowUp']) {
                cameraElevation = Math.min(Math.PI / 2 - 0.05, cameraElevation + rotSpeed);
                cameraRotated = true;
            }
            if (keysPressed['ArrowDown']) {
                cameraElevation = Math.max(-Math.PI / 6, cameraElevation - rotSpeed);
                cameraRotated = true;
            }

            if (cameraRotated) {
                updateCameraPosition();
            }

            if (lastTime !== undefined && gameSpeed > 0) {
                const dt = (time - lastTime) / 1000;
                world.step(fixedTimeStep, dt * gameSpeed, 5);
            }
            lastTime = time;

            physicsObjects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);

                // Эффект медленного кровотечения / стекания жидкостей
                if (obj.body.bleedAmount > 0 && gameSpeed > 0) {
                    obj.body.bleedAmount -= 0.15 * gameSpeed; // Постепенно останавливаем
                    
                    // Шанс капнуть каплю зависит от тяжести "ранения"
                    if (Math.random() < obj.body.bleedAmount * 0.004 * gameSpeed) {
                        const dripPos = new THREE.Vector3(
                            obj.body.position.x + (Math.random() - 0.5) * 0.3,
                            obj.body.position.y - 0.2, // Капает чуть ниже центра объекта
                            obj.body.position.z + (Math.random() - 0.5) * 0.3
                        );
                        // Вызываем функцию с флагом isDrip = true (капля, а не брызги)
                        spawnJuiceParticles(dripPos, obj.juiceColor, 1 + Math.floor(Math.random() * 2), true);
                    }
                }

                if (!is3DMode) {
                    obj.body.position.z = 0;
                    obj.body.velocity.z = 0;
                    obj.body.angularVelocity.x = 0;
                    obj.body.angularVelocity.y = 0;
                } else {
                    if (obj.body.position.z < -5.7) {
                        obj.body.position.z = -5.7;
                        obj.body.velocity.z *= -0.2;
                    }
                    if (obj.body.position.z > 5.7) {
                        obj.body.position.z = 5.7;
                        obj.body.velocity.z *= -0.2;
                    }
                }
            });

            // Обновление партиклов крови и создание следов
            for (let i = particleSystems.length - 1; i >= 0; i--) {
                const ps = particleSystems[i];
                ps.life -= 0.012;
                const pos = ps.mesh.geometry.attributes.position.array;

                for (let j = 0; j < ps.count; j++) {
                    if (ps.landed[j]) continue;

                    ps.velocities[j * 3 + 1] -= 28 * 0.016;

                    pos[j * 3] += ps.velocities[j * 3] * 0.016;
                    pos[j * 3 + 1] += ps.velocities[j * 3 + 1] * 0.016;
                    pos[j * 3 + 2] += ps.velocities[j * 3 + 2] * 0.016;

                    ps.velocities[j * 3] *= 0.97;
                    ps.velocities[j * 3 + 2] *= 0.97;

                    // ИСПРАВЛЕНИЕ: Проверяем касание пола на Y <= 0.11 (верх пола Y = 0.1)
                    if (pos[j * 3 + 1] <= 0.11) {
                        ps.landed[j] = true;
                        createStain(pos[j * 3], 0.11, ps.colorHex, 0.6 + Math.random() * 0.5, pos[j * 3 + 2], 'floor');
                        pos[j * 3 + 1] = -100; // Скрываем каплю под землю
                    } else if (pos[j * 3 + 2] <= -5.5) {
                        ps.landed[j] = true;
                        createStain(pos[j * 3], pos[j * 3 + 1], ps.colorHex, 0.6 + Math.random() * 0.5, -5.74, 'wall');
                        pos[j * 3 + 1] = -100; // Скрываем каплю
                    }
                }
                ps.mesh.geometry.attributes.position.needsUpdate = true;
                ps.mesh.material.opacity = Math.max(0, ps.life);

                if (ps.life <= 0) {
                    scene.remove(ps.mesh);
                    if (ps.mesh.geometry) ps.mesh.geometry.dispose();
                    if (ps.mesh.material) ps.mesh.material.dispose();
                    particleSystems.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initThree();
            initCannon();
            setupInteractions();
            setupUI();

            spawnRagdoll(0, 8, 'melon');

            animate();
        };
    </script>
</body>
