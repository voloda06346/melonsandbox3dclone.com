<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        button {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px) scale(0.97);
        }
        
        /* Стили для водяного знака */
        .bottom-right-text {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
        }

        /* Анимации для уведомлений о достижениях */
        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }
        .toast-enter {
            animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .toast-exit {
            animation: fadeOut 0.4s ease-in forwards;
        }
        
        /* Прогресс-бар достижений */
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            width: 100%;
            margin-top: 6px;
        }
        .progress-bar-fill {
            background: #10b981;
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.6; 
                masterGain.connect(audioCtx.destination);

                const bufferSize = audioCtx.sampleRate * 2.0;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const k = 400, n_samples = 44100, deg = Math.PI / 180;
                distCurve = new Float32Array(n_samples);
                for (let i = 0; i < n_samples; ++i) {
                    const x = i * 2 / n_samples - 1;
                    distCurve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
            }
        }

        function playSound(type, param = 1) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                
                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain); gain.connect(masterGain);
                    osc.start(now); osc.stop(now + 0.1);
                    
                } else if (type === 'shot') {
                    const dur = 0.4;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + dur);
                    const oscGain = audioCtx.createGain();
                    oscGain.gain.setValueAtTime(1.2, now);
                    oscGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    osc.connect(oscGain); oscGain.connect(masterGain);
                    osc.start(now); osc.stop(now + dur);

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(6000, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + dur);
                    const nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(1.5, now);
                    nGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    noise.connect(filter); filter.connect(nGain); nGain.connect(masterGain);
                    noise.start(now); noise.stop(now + dur);
                    
                } else if (type === 'explosion') {
                    const dur = 1.5;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, now);
                    osc.frequency.exponentialRampToValueAtTime(10, now + dur);
                    const oscGain = audioCtx.createGain();
                    oscGain.gain.setValueAtTime(2.0, now); 
                    oscGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    osc.connect(oscGain); oscGain.connect(masterGain);
                    osc.start(now); osc.stop(now + dur);

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const dist = audioCtx.createWaveShaper();
                    dist.curve = distCurve;
                    dist.oversample = '4x';
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3000, now);
                    filter.frequency.exponentialRampToValueAtTime(50, now + dur);
                    const nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(1.8, now);
                    nGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    noise.connect(dist); dist.connect(filter); filter.connect(nGain); nGain.connect(masterGain);
                    noise.start(now); noise.stop(now + dur);
                    
                } else if (type === 'hit') {
                    const vol = Math.min(Math.max(param, 0.05), 1.0);
                    const dur = 0.15;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'square'; 
                    osc.frequency.setValueAtTime(120 + Math.random()*60, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + dur);
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1200, now);
                    filter.frequency.exponentialRampToValueAtTime(100, now + dur);
                    const oscGain = audioCtx.createGain();
                    oscGain.gain.setValueAtTime(vol * 1.2, now);
                    oscGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    osc.connect(filter); filter.connect(oscGain); oscGain.connect(masterGain);
                    osc.start(now); osc.stop(now + dur);

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const nFilter = audioCtx.createBiquadFilter();
                    nFilter.type = 'highpass';
                    nFilter.frequency.value = 800;
                    const nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(vol * 0.8, now);
                    nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); 
                    noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(masterGain);
                    noise.start(now); noise.stop(now + 0.05);
                    
                } else if (type === 'splat') {
                    const vol = Math.min(Math.max(param, 0.05), 1.0);
                    const dur = 0.25;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150 + Math.random()*50, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + dur);
                    const oscGain = audioCtx.createGain();
                    oscGain.gain.setValueAtTime(vol * 1.5, now);
                    oscGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    osc.connect(oscGain); oscGain.connect(masterGain);
                    osc.start(now); osc.stop(now + dur);

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.value = 3.5;
                    filter.frequency.setValueAtTime(1800 + Math.random()*1000, now);
                    filter.frequency.exponentialRampToValueAtTime(200, now + dur);
                    const nGain = audioCtx.createGain();
                    nGain.gain.setValueAtTime(vol * 2.0, now);
                    nGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    noise.connect(filter); filter.connect(nGain); nGain.connect(masterGain);
                    noise.start(now); noise.stop(now + dur);
                }
            } catch(e) {}
        }

        function getStainManager(colorHex) {
            if (!stainManagers[colorHex]) {
                const mat = new THREE.MeshBasicMaterial({ 
                    color: colorHex, 
                    transparent: true, 
                    opacity: 0.85, 
                    depthWrite: false 
                });
                const mesh = new THREE.InstancedMesh(sharedStainGeom, mat, MAX_STAINS_PER_COLOR);
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                mesh.count = 0;
                scene.add(mesh);
                
                stainManagers[colorHex] = {
                    mesh: mesh,
                    currentIndex: 0
                };
            }
            return stainManagers[colorHex];
        }

        function createStain(x, y, colorHex, scale = 1, z = 0, surfaceType = 'auto') {
            updateStat('stains_created', 1);

            const isWall = (surfaceType === 'wall') || (surfaceType === 'auto' && z <= -5.0);
            const manager = getStainManager(colorHex);
            
            const radius = (0.2 + Math.random() * 0.7) * scale;
            dummyStain.scale.set(radius, radius * (0.6 + Math.random() * 0.7), 1);

            if (isWall) {
                dummyStain.position.set(x, Math.max(0.2, y), -5.74 + (Math.random() * 0.01));
                dummyStain.rotation.set(0, 0, Math.random() * Math.PI * 2);
            } else {
                const clampedZ = Math.max(-5.5, Math.min(5.5, z));
                dummyStain.position.set(x, 0.11 + (Math.random() * 0.005), clampedZ);
                dummyStain.rotation.set(-Math.PI / 2, 0, Math.random() * Math.PI * 2);
            }

            dummyStain.updateMatrix();
            manager.mesh.setMatrixAt(manager.currentIndex, dummyStain.matrix);
            manager.mesh.instanceMatrix.needsUpdate = true;

            manager.currentIndex = (manager.currentIndex + 1) % MAX_STAINS_PER_COLOR;
            if (manager.mesh.count < MAX_STAINS_PER_COLOR) {
                manager.mesh.count++;
            }
        }

        function spawnJuiceParticles(pos, colorHex, count = 20, isDrip = false) {
            updateStat('blood_particles', count);

            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const landed = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                if (isDrip) {
                    velocities.push(
                        (Math.random() - 0.5) * 2.5,
                        -(Math.random() * 2), 
                        is3DMode ? (Math.random() - 0.5) * 2.5 : (Math.random() - 0.5) * 0.5
                    );
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1); 
                    const speed = Math.random() * 18 + 4;
                    
                    let vx = Math.sin(phi) * Math.cos(theta) * speed;
                    let vy = (Math.cos(phi) * speed) + 5;
                    let vz = is3DMode ? (Math.sin(phi) * Math.sin(theta) * speed) : ((Math.random() - 0.5) * 5);

                    velocities.push(vx, vy, vz);
                }
                landed.push(false);
            }

            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.35, transparent: true, opacity: 0.95 });
            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            particleSystems.push({
                mesh: pSystem,
                count: count,
                velocities: velocities,
                landed: landed,
                colorHex: colorHex,
                life: 1.0
            });
        }

        function createShape(type, x, y, options = {}) {
            updateStat('spawns', 1);

            const mass = options.mass || 1;
            const color = options.color || 0xcccccc;
            
            let shape, geometry;
            const w = options.w || 1, h = options.h || 1, d = options.d || 1;
            const r = options.r || 0.5;

            if (type === 'box') {
                shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
                geometry = new THREE.BoxGeometry(w, h, d);
            } else if (type === 'sphere') {
                shape = new CANNON.Sphere(r);
                geometry = new THREE.SphereGeometry(r, 24, 24);
            } else if (type === 'cylinder') {
                shape = new CANNON.Cylinder(r, r, h, 16);
                geometry = new THREE.CylinderGeometry(r, r, h, 16);
            }

            const body = new CANNON.Body({ mass: mass, material: physicsMaterial });
            body.addShape(shape);
            const initialZ = options.z !== undefined ? options.z : (is3DMode ? (Math.random() - 0.5) * 2 : 0);
            body.position.set(x, y, initialZ);
            updatePhysicsFactors(body);

            body.isBomb = options.isBomb || false;
            body.isGun = options.isGun || false;
            body.isSyringe = options.isSyringe || false;
            body.syringeType = options.syringeType || null;
            body.isFruit = options.isFruit || false;
            body.juiceColor = options.juiceColor || null;
            body.lastHitTime = 0;
            body.bleedAmount = 0; 

            body.addEventListener('collide', (e) => {
                const impact = Math.abs(e.contact.getImpactVelocityAlongNormal());
                const now = performance.now();
                
                if (impact > 2.5 && (now - body.lastHitTime > 80)) {
                    body.lastHitTime = now;
                    initAudio();
                    const volume = Math.min(impact / 15, 1.0);
                    
                    if (body.isFruit || body.juiceColor) {
                        playSound(body.isFruit ? 'splat' : 'hit', volume);
                        if (impact > 4 && body.juiceColor) {
                            spawnJuiceParticles(body.position, body.juiceColor, Math.floor(volume * 80));
                            body.bleedAmount = Math.min(body.bleedAmount + impact * 6, 400); 
                        }
                    } else {
                        playSound('hit', volume);
                    }
                }
            });

            world.addBody(body);

            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: options.roughness || 0.4,
                metalness: options.metalness || 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.body = body;
            scene.add(mesh);

            physicsObjects.push({ mesh, body, juiceColor: options.juiceColor || color });
            return body;
        }

        function explode(center, radius = 10, force = 750) {
            initAudio();
            playSound('explosion');
            updateStat('explosions', 1);

            spawnJuiceParticles(center, 0xf97316, 150);

            for (let i = 0; i < world.bodies.length; i++) {
                const b = world.bodies[i];
                if (b.mass === 0 || b.type === CANNON.Body.KINEMATIC) continue;

                const dist = b.position.distanceTo(center);
                if (dist < radius && dist > 0) {
                    const dir = new CANNON.Vec3();
                    b.position.vsub(center, dir);
                    
                    if (is3DMode) {
                        dir.z += (Math.random() - 0.5) * 1.2;
                    } else {
                        dir.z = 0;
                    }

                    dir.normalize();
                    const pForce = force * (1 - (dist / radius));
                    dir.scale(pForce, dir);
                    b.applyImpulse(dir, b.position);

                    const item = physicsObjects.find(o => o.body === b);
                    if (item && item.juiceColor) {
                        spawnJuiceParticles(b.position, item.juiceColor, 100);
                        b.bleedAmount = Math.min((b.bleedAmount || 0) + 250, 400);
                    }
                }
            }
        }

        function spawnRagdoll(x, y, type = 'melon') {
            initAudio();
            playSound('pop');
            updateStat('spawns', 1);
            
            let mainColor, bodyColor, juiceColor;
            if (type === 'melon') {
                mainColor = 0x10b981; 
                bodyColor = 0x047857;
                juiceColor = 0xef4444; 
            } else if (type === 'pumpkin') {
                mainColor = 0xf59e0b; 
                bodyColor = 0xd97706;
                juiceColor = 0xf97316; 
            } else {
                mainColor = 0xef4444; 
                bodyColor = 0xb91c1c;
                juiceColor = 0xd97706; 
            }

            const z = is3DMode ? (Math.random() - 0.5) * 2 : 0;

            function createPart(w, h, d, px, py, pz, color, mass = 1) {
                const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
                const body = new CANNON.Body({ mass: mass, material: physicsMaterial });
                body.addShape(shape);
                body.position.set(px, py, pz);
                updatePhysicsFactors(body);

                body.isFruit = true;
                body.juiceColor = juiceColor;
                body.ragdollType = type;
                body.lastHitTime = 0;
                body.bleedAmount = 0; 

                body.addEventListener('collide', (e) => {
                    const impact = Math.abs(e.contact.getImpactVelocityAlongNormal());
                    const now = performance.now();
                    if (impact > 2.5 && (now - body.lastHitTime > 80)) {
                        body.lastHitTime = now;
                        initAudio();
                        const volume = Math.min(impact / 15, 1.0);
                        playSound('splat', volume);
                        
                        if (body.ragdollType === 'melon') {
                            updateStat('melon_hits', 1);
                        } else if (body.ragdollType === 'pumpkin') {
                            updateStat('pumpkin_hits', 1);
                        } else if (body.ragdollType === 'apple') {
                            updateStat('apple_hits', 1);
                        }

                        if (impact > 3.5) {
                            spawnJuiceParticles(body.position, body.juiceColor, Math.floor(volume * 180));
                            body.bleedAmount = Math.min(body.bleedAmount + impact * 10, 400);
                        }
                    }
                });

                world.addBody(body);

                const geom = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.1 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.body = body;
                scene.add(mesh);

                physicsObjects.push({ mesh, body, juiceColor });
                return body;
            }

            const head = createPart(0.8, 0.8, 0.8, x, y + 1.8, z, mainColor, 1.2);
            const torso = createPart(0.9, 1.3, 0.5, x, y + 0.8, z, bodyColor, 2.5);
            const armL = createPart(0.35, 0.9, 0.35, x - 0.7, y + 0.9, z, mainColor, 0.6);
            const armR = createPart(0.35, 0.9, 0.35, x + 0.7, y + 0.9, z, mainColor, 0.6);
            const legL = createPart(0.38, 1.0, 0.38, x - 0.3, y - 0.3, z, bodyColor, 0.8);
            const legR = createPart(0.38, 1.0, 0.38, x + 0.3, y - 0.3, z, bodyColor, 0.8);

            function join(bodyA, pivotA, bodyB, pivotB) {
                const c = new CANNON.PointToPointConstraint(
                    bodyA, new CANNON.Vec3(...pivotA),
                    bodyB, new CANNON.Vec3(...pivotB)
                );
                world.addConstraint(c);
            }

            join(head, [0, -0.45, 0], torso, [0, 0.7, 0]);
            join(armL, [0, 0.4, 0], torso, [-0.55, 0.5, 0]);
            join(armR, [0, 0.4, 0], torso, [0.55, 0.5, 0]);
            join(legL, [0, 0.45, 0], torso, [-0.25, -0.7, 0]);
            join(legR, [0, 0.45, 0], torso, [0.25, -0.7, 0]);
        }

        function spawnWeapon(type) {
            initAudio();
            playSound('pop');
            const x = (Math.random() - 0.5) * 6;
            const y = 10;

            if (type === 'barrel') {
                updateStat('barrels_spawned', 1);
                const body = createShape('cylinder', x, y, { r: 0.7, h: 1.6, mass: 4, color: 0xea580c, roughness: 0.3, metalness: 0.4, juiceColor: 0x1c1917 });
                body.isBomb = true;
            } else if (type === 'sword') {
                updateStat('swords_spawned', 1);
                const body = createShape('box', x, y, { w: 0.25, h: 2.2, d: 0.15, mass: 1.5, color: 0xcbd5e1, roughness: 0.2, metalness: 0.8, juiceColor: 0x94a3b8 });
                body.isWeapon = true;
            } else if (type === 'gun') {
                updateStat('guns_spawned', 1);
                const body = createShape('box', x, y, { w: 0.8, h: 0.5, d: 0.25, mass: 1.2, color: 0x334155, roughness: 0.3, metalness: 0.7, juiceColor: 0x1e293b });
                body.isGun = true;
            } else if (type === 'syringe-heal') {
                updateStat('heals_spawned', 1);
                const body = createShape('cylinder', x, y, { r: 0.2, h: 0.9, mass: 0.8, color: 0x14b8a6, roughness: 0.2, metalness: 0.5, juiceColor: 0x14b8a6 });
                body.isSyringe = true;
                body.syringeType = 'heal';
            } else if (type === 'syringe-acid') {
                updateStat('acids_spawned', 1);
                const body = createShape('cylinder', x, y, { r: 0.2, h: 0.9, mass: 0.8, color: 0x84cc16, roughness: 0.2, metalness: 0.5, juiceColor: 0x84cc16 });
                body.isSyringe = true;
                body.syringeType = 'acid';
            }
        }

        function shootGun(gunBody) {
            initAudio();
            playSound('shot');
            updateStat('gun_shots', 1);

            const dir = new THREE.Vector3(1, 0.1, (Math.random() - 0.5) * 0.2).normalize();
            const spawnPos = new THREE.Vector3(gunBody.position.x + dir.x * 0.8, gunBody.position.y + dir.y * 0.8, gunBody.position.z);

            const shape = new CANNON.Sphere(0.15);
            const bulletBody = new CANNON.Body({ mass: 0.3, material: physicsMaterial });
            bulletBody.addShape(shape);
            bulletBody.position.copy(spawnPos);
            bulletBody.velocity.set(dir.x * 45, dir.y * 45, dir.z * 45);
            updatePhysicsFactors(bulletBody);

            const geom = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const mesh = new THREE.Mesh(geom, mat);
            scene.add(mesh);

            physicsObjects.push({ mesh, body: bulletBody, juiceColor: 0xfacc15 });
            world.addBody(bulletBody);

            spawnJuiceParticles(spawnPos, 0xfde047, 6);

            bulletBody.addEventListener('collide', (e) => {
                const hitBody = e.body;
                if (hitBody && hitBody !== gunBody) {
                    if (hitBody.juiceColor) {
                        spawnJuiceParticles(bulletBody.position, hitBody.juiceColor, 120);
                        hitBody.bleedAmount = Math.min((hitBody.bleedAmount || 0) + 150, 400);
                        
                        if (hitBody.ragdollType === 'melon') {
                            updateStat('melon_hits', 1);
                        } else if (hitBody.ragdollType === 'pumpkin') {
                            updateStat('pumpkin_hits', 1);
                        } else if (hitBody.ragdollType === 'apple') {
                            updateStat('apple_hits', 1);
                        }
                    }
                    const pushDir = new CANNON.Vec3(dir.x * 80, dir.y * 80, dir.z * 80);
                    hitBody.applyImpulse(pushDir, bulletBody.position);
                    setTimeout(() => removeBodyAndMesh(bulletBody), 10);
                }
            });

            setTimeout(() => {
                removeBodyAndMesh(bulletBody);
            }, 2000);
        }

        function setupInteractions() {
            function updateMousePos(e) {
                let cx = e.clientX, cy = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    cx = e.touches[0].clientX;
                    cy = e.touches[0].clientY;
                }
                mouse.x = (cx / window.innerWidth) * 2 - 1;
                mouse.y = -(cy / window.innerHeight) * 2 + 1;
            }

            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    keysPressed[e.code] = true;
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    keysPressed[e.code] = false;
                }
            });

            function onWheel(e) {
                if (isDragging && constrainedBody && is3DMode) {
                    e.preventDefault();
                    const delta = Math.sign(e.deltaY) * -0.6;
                    let newZ = mouseKinematicBody.position.z + delta;
                    newZ = Math.max(-5.7, Math.min(5.7, newZ));
                    mouseKinematicBody.position.z = newZ;
                }
            }

            function onPointerDown(e) {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.closest('#achievements-modal')) return;
                initAudio();
                updateMousePos(e);
                raycaster.setFromCamera(mouse, camera);

                const meshes = physicsObjects.map(o => o.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const hitBody = hitMesh.userData.body;

                    if (hitBody.isBomb && e.detail === 2) {
                        explode(hitBody.position);
                        removeBodyAndMesh(hitBody);
                        return;
                    }

                    if (hitBody.isGun) {
                        shootGun(hitBody);
                    }

                    isDragging = true;
                    constrainedBody = hitBody;
                    updateStat('grabs', 1);
                    const p = intersects[0].point;
                    mouseKinematicBody.position.set(p.x, p.y, hitBody.position.z);

                    const localPivot = new CANNON.Vec3();
                    constrainedBody.pointToLocalFrame(new CANNON.Vec3(p.x, p.y, hitBody.position.z), localPivot);

                    mouseConstraint = new CANNON.PointToPointConstraint(
                        mouseKinematicBody, new CANNON.Vec3(0,0,0),
                        constrainedBody, localPivot
                    );
                    world.addConstraint(mouseConstraint);
                    constrainedBody.wakeUp();
                }
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                updateMousePos(e);
                raycaster.setFromCamera(mouse, camera);
                
                dragPlane.position.z = mouseKinematicBody.position.z;
                dragPlane.quaternion.copy(camera.quaternion);

                const intersects = raycaster.intersectObject(dragPlane);
                if (intersects.length > 0) {
                    mouseKinematicBody.position.x = intersects[0].point.x;
                    mouseKinematicBody.position.y = intersects[0].point.y;
                }
            }

            function onPointerUp() {
                if (isDragging && mouseConstraint) {
                    world.removeConstraint(mouseConstraint);
                    mouseConstraint = null;
                    constrainedBody = null;
                    isDragging = false;
                }
            }

            window.addEventListener('wheel', onWheel, { passive: false });
            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('dblclick', onPointerDown);

            window.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
        }

        function removeBodyAndMesh(body) {
            world.removeBody(body);
            const idx = physicsObjects.findIndex(o => o.body === body);
            if (idx !== -1) {
                scene.remove(physicsObjects[idx].mesh);
                physicsObjects.splice(idx, 1);
            }
        }

        function setupUI() {
            document.getElementById('btn-melon').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'melon');
            document.getElementById('btn-pumpkin').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'pumpkin');
            document.getElementById('btn-apple').onclick = () => spawnRagdoll((Math.random() - 0.5) * 6, 10, 'apple');

            document.getElementById('btn-box').onclick = () => {
                updateStat('boxes_spawned', 1);
                initAudio();
                playSound('pop');
                createShape('box', (Math.random() - 0.5) * 6, 10, { w: 1.6, h: 1.6, d: 1.6, mass: 2, color: 0xa16207, juiceColor: 0x713f12 }); 
            };
            document.getElementById('btn-barrel').onclick = () => spawnWeapon('barrel');
            document.getElementById('btn-sword').onclick = () => spawnWeapon('sword');
            document.getElementById('btn-gun').onclick = () => spawnWeapon('gun');
            document.getElementById('btn-bomb').onclick = () => {
                initAudio();
                playSound('pop');
                createShape('sphere', (Math.random() - 0.5) * 6, 10, { r: 0.8, mass: 3, color: 0xe11d48, isBomb: true, juiceColor: 0x4c0519 });
            };

            document.getElementById('btn-syringe-heal').onclick = () => spawnWeapon('syringe-heal');
            document.getElementById('btn-syringe-acid').onclick = () => spawnWeapon('syringe-acid');

            const btn3d = document.getElementById('btn-mode-3d');
            btn3d.onclick = () => {
                is3DMode = !is3DMode;
                btn3d.innerHTML = is3DMode ? '🧊 <span class="hidden md:inline">3D Глубина</span>' : '🟦 <span class="hidden md:inline">2D Плоскость</span>';
                btn3d.className = is3DMode 
                    ? 'bg-indigo-700 hover:bg-indigo-600 text-white font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-indigo-500/50'
                    : 'bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-1.5 px-3 rounded-lg text-xs md:text-sm flex items-center gap-1 border border-slate-600';
                
                physicsObjects.forEach(obj => updatePhysicsFactors(obj.body));
            };
            
            const modalAch = document.getElementById('achievements-modal');
            document.getElementById('btn-achievements').onclick = () => {
                renderAchievementsUI();
                modalAch.classList.remove('hidden');
            };
            document.getElementById('btn-close-achievements').onclick = () => {
                modalAch.classList.add('hidden');
            };

            document.getElementById('select-speed').onchange = (e) => {
                gameSpeed = parseFloat(e.target.value);
            };

            document.getElementById('btn-clear').onclick = () => {
                updateStat('clears', 1);
                for (let i = physicsObjects.length - 1; i >= 0; i--) {
                    world.removeBody(physicsObjects[i].body);
                    scene.remove(physicsObjects[i].mesh);
                }
                physicsObjects = [];
                while (world.constraints.length > 0) {
                    world.removeConstraint(world.constraints[0]);
                }
                
                for (let key in stainManagers) {
                    stainManagers[key].mesh.count = 0;
                    stainManagers[key].currentIndex = 0;
                    stainManagers[key].mesh.instanceMatrix.needsUpdate = true;
                }
            };

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        const fixedTimeStep = 1 / 60;
        let lastTime;

        function animate(time) {
            requestAnimationFrame(animate);

            let cameraRotated = false;
            const rotSpeed = 0.025;
            if (keysPressed['ArrowLeft']) {
                cameraAzimuth -= rotSpeed;
                cameraRotated = true;
            }
            if (keysPressed['ArrowRight']) {
                cameraAzimuth += rotSpeed;
                cameraRotated = true;
            }
            if (keysPressed['ArrowUp']) {
                cameraElevation = Math.min(Math.PI / 2 - 0.05, cameraElevation + rotSpeed);
                cameraRotated = true;
            }
            if (keysPressed['ArrowDown']) {
                cameraElevation = Math.max(-Math.PI / 6, cameraElevation - rotSpeed);
                cameraRotated = true;
            }

            if (cameraRotated) {
                updateCameraPosition();
            }

            if (lastTime !== undefined && gameSpeed > 0) {
                const dt = (time - lastTime) / 1000;
                world.step(fixedTimeStep, dt * gameSpeed, 5);
            }
            lastTime = time;

            physicsObjects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);

                if (obj.body.bleedAmount > 0 && gameSpeed > 0) {
                    obj.body.bleedAmount -= 0.04 * gameSpeed; 
                    
                    if (Math.random() < obj.body.bleedAmount * 0.012 * gameSpeed) {
                        const dripPos = new THREE.Vector3(
                            obj.body.position.x + (Math.random() - 0.5) * 0.4,
                            obj.body.position.y - 0.25, 
                            obj.body.position.z + (Math.random() - 0.5) * 0.4
                        );
                        spawnJuiceParticles(dripPos, obj.juiceColor, 1 + Math.floor(Math.random() * 2), true);
                    }
                }

                if (!is3DMode) {
                    obj.body.position.z = 0;
                    obj.body.velocity.z = 0;
                    obj.body.angularVelocity.x = 0;
                    obj.body.angularVelocity.y = 0;
                } else {
                    if (obj.body.position.z < -5.7) {
                        obj.body.position.z = -5.7;
                        obj.body.velocity.z *= -0.2;
                    }
                    if (obj.body.position.z > 5.7) {
                        obj.body.position.z = 5.7;
                        obj.body.velocity.z *= -0.2;
                    }
                }
            });

            for (let i = particleSystems.length - 1; i >= 0; i--) {
                const ps = particleSystems[i];
                ps.life -= 0.012;
                const pos = ps.mesh.geometry.attributes.position.array;

                for (let j = 0; j < ps.count; j++) {
                    if (ps.landed[j]) continue;

                    ps.velocities[j * 3 + 1] -= 28 * 0.016;

                    pos[j * 3] += ps.velocities[j * 3] * 0.016;
                    pos[j * 3 + 1] += ps.velocities[j * 3 + 1] * 0.016;
                    pos[j * 3 + 2] += ps.velocities[j * 3 + 2] * 0.016;

                    ps.velocities[j * 3] *= 0.97;
                    ps.velocities[j * 3 + 2] *= 0.97;

                    if (pos[j * 3 + 1] <= 0.11) {
                        ps.landed[j] = true;
                        createStain(pos[j * 3], 0.11, ps.colorHex, 0.8 + Math.random() * 0.6, pos[j * 3 + 2], 'floor');
                        pos[j * 3 + 1] = -100; 
                    } else if (pos[j * 3 + 2] <= -5.5) {
                        ps.landed[j] = true;
                        createStain(pos[j * 3], pos[j * 3 + 1], ps.colorHex, 0.6 + Math.random() * 0.5, -5.74, 'wall');
                        pos[j * 3 + 1] = -100; 
                    }
                }
                ps.mesh.geometry.attributes.position.needsUpdate = true;
                ps.mesh.material.opacity = Math.max(0, ps.life);

                if (ps.life <= 0) {
                    scene.remove(ps.mesh);
                    if (ps.mesh.geometry) ps.mesh.geometry.dispose();
                    if (ps.mesh.material) ps.mesh.material.dispose();
                    particleSystems.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initThree();
            initCannon();
            setupInteractions();
            setupUI();

            spawnRagdoll(0, 8, 'melon');

            animate();
        };
    </script>
